name: safenest
description: SafeNest for phones — your own records, on your own machine.
publish_to: "none"
# Kept in step with the VERSION file. CI overrides both with --build-name/-number,
# but a LOCAL build reads this — left at 0.1.0 it made the in-app update check
# (lib/update.dart) think every server build was newer.
version: 1.38.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- talking to the customer's own server ---
  http: ^1.2.2
  # The token is a credential and must not sit in plain SharedPreferences, which
  # is a world-readable XML file on a rooted Android. This uses the Keychain on
  # iOS and EncryptedSharedPreferences on Android.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2      # non-secret settings only

  # --- the whole reason this app exists ---
  # Real photo-library access: the thing a web page is structurally forbidden.
  # No picker, no hundred-photo ceiling, and it can tell what has already been
  # backed up so a second run costs a comparison rather than 20,000 uploads.
  photo_manager: ^3.6.1
  photo_manager_image_provider: ^2.1.4
  # sha256, so the backup can ask the computer "which of these have you got?"
  # before uploading a library it already holds.
  crypto: ^3.0.6

  # Push from the owner's own server, by way of Firebase.
  #
  # There is no self-hosted route to an iPhone's lock screen: Apple and Google
  # deliver to native apps only through APNs and FCM. So this is the one place
  # something leaves the machine, and what leaves is a title and a line of
  # body — never a record. An installation that would rather not can leave it
  # unconfigured and rely on the local alarms below.
  #
  # CONFIGURED AT RUN TIME, not with google-services.json. The usual setup
  # applies a Gradle plugin that FAILS THE BUILD when that file is absent —
  # which would mean this app could not be compiled at all until somebody made
  # a Firebase project. Passing FirebaseOptions in Dart instead keeps the build
  # working for everyone and turns push on only where it is wanted.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Reminders that ring on the phone, scheduled ON the phone.
  #
  # NOT push. Push would mean routing the titles of somebody's reminders
  # through Google's servers, which is the one thing this product promises not
  # to do. These are scheduled locally from reminders already fetched, so they
  # fire with the phone in flight mode and nothing about them leaves the
  # device.
  flutter_local_notifications: ^18.0.1
  # The alarm sound, looped until it is dismissed. A single chime is what a
  # reminder for a bill due today gets lost behind.
  timezone: ^0.9.4

  # Holds the screen awake for the length of a backup, and only then.
  #
  # Both phone systems dim and then sleep an idle screen, and a sleeping screen
  # suspends the app — so a backup of twenty thousand photos would stop a minute
  # after it was started and the person watching would see it frozen at 3%. They
  # would then have to sit tapping the screen for half an hour, which is what
  # was actually happening.
  #
  # Released the moment the run ends, in a finally. A phone left awake all night
  # because a backup crashed is a flat battery blamed on this app.
  wakelock_plus: ^1.2.8

  # --- gallery, Google Photos shaped ---
  photo_view: ^0.15.0             # pinch-zoom in the lightbox
  # Plays a backed-up video in the viewer. The platform's own player on both
  # systems, so a phone's hardware decoder does the work rather than anything
  # shipped in this app.
  #
  # The URL it is given is the same signed, expiring one the grid uses for
  # thumbnails, so a video is no more reachable than a photo is.
  video_player: ^2.9.2

  # --- documents, Drive shaped ---
  file_picker: ^11.0.3
  open_filex: ^4.5.0
  path_provider: ^2.1.5

  # Reads the version out of the BUILD rather than a string someone has to
  # remember to update. The first version of the Profile screen hardcoded
  # "0.4.0" and was wrong by the next release — a version number that lies is
  # worse than none, because it is what somebody reports when asking for help.
  package_info_plus: ^8.1.1

  provider: ^6.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  cunning_document_scanner: ^2.8.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The owner's own icon, taken from their server's /branding/icon-512.png and
  # bundled so it is there before anyone signs in — the sign-in screen needs a
  # logo at the one moment there is no server to ask.
  #
  # Once signed in the app uses the LIVE icon from their machine instead, so
  # renaming or re-uploading on the desktop follows through to the phone. Only
  # the launcher icon is fixed at build time; nothing can change that.
  assets:
    - assets/icon-512.png
