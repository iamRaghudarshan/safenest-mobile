name: safenest
description: SafeNest for phones — your own records, on your own machine.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- talking to the customer's own server ---
  http: ^1.2.2
  # The token is a credential and must not sit in plain SharedPreferences, which
  # is a world-readable XML file on a rooted Android. This uses the Keychain on
  # iOS and EncryptedSharedPreferences on Android.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2      # non-secret settings only

  # --- the whole reason this app exists ---
  # Real photo-library access: the thing a web page is structurally forbidden.
  # No picker, no hundred-photo ceiling, and it can tell what has already been
  # backed up so a second run costs a comparison rather than 20,000 uploads.
  photo_manager: ^3.6.1
  photo_manager_image_provider: ^2.1.4

  # --- gallery, Google Photos shaped ---
  photo_view: ^0.15.0             # pinch-zoom in the lightbox

  # --- documents, Drive shaped ---
  file_picker: ^11.0.3
  open_filex: ^4.5.0
  path_provider: ^2.1.5

  # Reads the version out of the BUILD rather than a string someone has to
  # remember to update. The first version of the Profile screen hardcoded
  # "0.4.0" and was wrong by the next release — a version number that lies is
  # worse than none, because it is what somebody reports when asking for help.
  package_info_plus: ^8.1.1

  provider: ^6.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The owner's own icon, taken from their server's /branding/icon-512.png and
  # bundled so it is there before anyone signs in — the sign-in screen needs a
  # logo at the one moment there is no server to ask.
  #
  # Once signed in the app uses the LIVE icon from their machine instead, so
  # renaming or re-uploading on the desktop follows through to the phone. Only
  # the launcher icon is fixed at build time; nothing can change that.
  assets:
    - assets/icon-512.png
