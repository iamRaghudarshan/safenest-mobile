org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# A net under the Java-17 override in build.gradle.kts, not a replacement for it.
#
# That override makes a plugin's Java target match the Kotlin target this
# project pins to 17. If a future plugin defeats it in some new way, this turns
# AGP's mismatch check from an error into a warning so the build still
# produces an APK, and the warning says which module disagreed.
#
# Safe here specifically because this is an Android app: everything is compiled
# to DEX by D8, which consumes Java 8 and Kotlin 17 class files alike. The
# strict check is inherited from plain JVM libraries, where mixed targets can
# actually reach a runtime that cannot load them. Nothing here ships as a jar.
kotlin.jvm.target.validation.mode=warning
